# Production: headed Chrome + Xvfb, без VNC. UI :8080, скрин в screenshots/.
# Для экрана: docker compose -f docker-compose.test.yml up -d --build
services:
  axs:
    build:
      context: .
      args:
        CHROME_VERSION: ${CHROME_DEB_VERSION:-152.0.7977.82-1}
    image: task-axs:chrome-152
    env_file:
      - .env
    environment:
      CHROME_PATH: /usr/bin/google-chrome
      PROFILE_DIR: profile
      SCREENSHOTS_DIR: screenshots
      LOGS_DIR: logs
      HEADLESS: "0"
      VNC: "0"
      SPOOF_FP: "0"
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: "8080"
      DISPLAY: ":99"
    ports:
      - "8080:8080"
    volumes:
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
      - ./config/proxies.txt:/app/config/proxies.txt:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./web:/app/web:ro
    shm_size: "1gb"
    init: true
    user: "1000:1000"
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
